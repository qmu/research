name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # CI invokes the same Makefile targets developers run locally, so the
      # inspection logic lives in the repository, not in this workflow.

      # Runs FIRST, and deliberately so: every gate below is a per-package
      # Makefile target, and this proves those targets still report a failing
      # package instead of masking it. Without this the steps below can report
      # success on a tree that fails its own tests — which is exactly what
      # happened at 0b09ddc, where `main` was red and this workflow was green.
      - name: Gate self-check (targets must not mask failures)
        run: make gate

      - name: Install
        run: make install

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Lint
        run: make lint

      - name: Accessibility check (WCAG 2.2 AA)
        run: make a11y

      # The exporter shares its destination directory with hand-authored prose on
      # qmu-co-jp, so a re-run must never silently replace it.
      - name: Publish ownership guard
        run: make publish-guard

      # Byte-stability of the keyless fixture path is the pipeline mission's
      # load-bearing constraint: regenerating every topic's fixture must
      # byte-match the committed pages/artifacts.
      - name: Keyless fixture drift
        run: make drift

      - name: Audit dependencies
        run: |
          for p in packages/tech packages/industry; do
            (cd "$p" && npm audit --audit-level=high) || true
          done

  # Deploys the built preview site to the staging Worker. It lives in THIS file
  # rather than in a `workflow_run`-keyed workflow of its own, for the same
  # reason `make gate` runs first above: the order that matters — every gate
  # passes, THEN we deploy — should be readable in one place. `workflow_run`
  # would express the same order through a detached run that carries neither the
  # triggering ref's context nor its workflow file, which is harder to reason
  # about for no gain here.
  #
  # It is a separate JOB rather than more steps on `check` so that the secrets
  # below exist only in this job's environment. `check` runs on every pull
  # request, including from forks; it must never be a job that holds a token.
  # The cost of the split is one install and one docs build in a fresh runner —
  # `make install-docs` skips the research packages, which the site build does
  # not touch.
  deploy:
    needs: check
    # `push` to `main` only: a pull_request event never satisfies this, so a PR
    # (fork or not) runs no deploy and needs no secret. The repository check
    # stops a fork's own `main` from deploying to our Worker.
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && github.repository == 'qmu/research'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install docs dependencies
        run: make install-docs

      # No `|| true` and no `continue-on-error`: a failed deploy must fail the
      # run rather than leave the previous build silently in place. See the
      # 0b09ddc masking incident recorded in CLAUDE.md.
      #
      # The credentials are passed into this step's environment and nowhere
      # else. Never interpolate them into a `run:` string.
      - name: Deploy the preview site
        run: make deploy-docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
